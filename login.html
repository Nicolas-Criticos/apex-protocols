<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e0e">
  <title>Login — Apex Protocols</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0e0e0e;
      font-family: 'Barlow', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrap {
      background: #1a1a1a;
      width: 100%;
      max-width: 420px;
      margin: 1rem;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .login-header {
      padding: 2.5rem 2rem 1.5rem;
      text-align: center;
      border-bottom: 3px solid #cc2222;
      background: linear-gradient(180deg, #111 0%, #1a1a1a 100%);
    }
    .login-brand {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.75rem;
    }
    .login-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #ff3b3b;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .login-divider {
      width: 40px;
      height: 2px;
      background: #cc2222;
      margin: 0.75rem auto 0;
    }

    .login-tabs {
      display: flex;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
    }
    .login-tab {
      flex: 1;
      padding: 0.85rem;
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #555;
      cursor: pointer;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      transition: color 0.2s, background 0.2s;
    }
    .login-tab.active {
      color: #cc2222;
      border-bottom-color: #cc2222;
      background: #161616;
    }

    .login-form {
      padding: 2rem;
    }
    .login-form.hidden { display: none; }

    .field {
      margin-bottom: 1.25rem;
    }
    .field label {
      display: block;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      font-size: 14px;
      font-family: 'Barlow', sans-serif;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus {
      border-color: #cc2222;
    }

    .login-btn {
      width: 100%;
      background: #cc2222;
      border: none;
      color: #fff;
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 13px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }
    .login-btn:hover { background: #e02525; }
    .login-btn:disabled {
      background: #333;
      cursor: not-allowed;
    }

    .login-error {
      background: rgba(204, 34, 34, 0.1);
      border: 1px solid #cc2222;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: #ff6666;
      margin-bottom: 1rem;
      display: none;
    }
    .login-error.visible { display: block; }

    .login-success {
      background: rgba(34, 204, 34, 0.1);
      border: 1px solid #22cc22;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: #66ff66;
      margin-bottom: 1rem;
      display: none;
    }
    .login-success.visible { display: block; }

    .login-footer {
      padding: 1.25rem 2rem;
      text-align: center;
      border-top: 1px solid #2a2a2a;
    }
    .login-footer-text {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-header">
      <div class="login-brand">Apex Protocols</div>
      <div class="login-title">Welcome</div>
      <div class="login-divider"></div>
    </div>

    <div class="login-tabs">
      <button class="login-tab active" onclick="showForm('signin')">Sign In</button>
      <button class="login-tab" onclick="showForm('signup')">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <div class="login-form" id="signin-form">
      <div class="login-error" id="signin-error"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signin-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="login-btn" id="signin-btn" onclick="handleSignIn()">Sign In</button>
    </div>

    <!-- Sign Up Form -->
    <div class="login-form hidden" id="signup-form">
      <div class="login-error" id="signup-error"></div>
      <div class="login-success" id="signup-success"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Min 6 characters" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="signup-confirm" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="login-btn" id="signup-btn" onclick="handleSignUp()">Create Account</button>
    </div>

    <div class="login-footer">
      <div class="login-footer-text">The Foundation Protocol</div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './src/supabase.js';

    // Check if already logged in
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = '/';
      }
    })();

    function showForm(form) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('signin-form').classList.toggle('hidden', form !== 'signin');
      document.getElementById('signup-form').classList.toggle('hidden', form !== 'signup');
    }
    window.showForm = showForm;

    async function handleSignIn() {
      const email = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;
      const errEl = document.getElementById('signin-error');
      const btn = document.getElementById('signin-btn');

      errEl.classList.remove('visible');
      if (!email || !password) {
        errEl.textContent = 'Please fill in all fields.';
        errEl.classList.add('visible');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = error.message;
        errEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      window.location.href = '/';
    }
    window.handleSignIn = handleSignIn;

    async function handleSignUp() {
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const errEl = document.getElementById('signup-error');
      const succEl = document.getElementById('signup-success');
      const btn = document.getElementById('signup-btn');

      errEl.classList.remove('visible');
      succEl.classList.remove('visible');

      if (!email || !password || !confirm) {
        errEl.textContent = 'Please fill in all fields.';
        errEl.classList.add('visible');
        return;
      }
      if (password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.classList.add('visible');
        return;
      }
      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.add('visible');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const { error } = await supabase.auth.signUp({ email, password });
      if (error) {
        errEl.textContent = error.message;
        errEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Create Account';
        return;
      }

      succEl.textContent = 'Account created! Check your email to confirm, then sign in.';
      succEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
    window.handleSignUp = handleSignUp;

    // Handle enter key
    document.querySelectorAll('#signin-form input').forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') handleSignIn(); });
    });
    document.querySelectorAll('#signup-form input').forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') handleSignUp(); });
    });
  </script>
</body>
</html>
